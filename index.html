<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <title>Stellar Quizzes</title>
</head>

<body>
    <header>
        <h1>Stellar Quizzes | By Adriano's Portfolio</h1>
    </header>
    <main>
        <h2>Timer : 3:00</h2>
        <h3>Where is Montreal</h3>
        <label for="c1"><input type="radio" name="requirement" value="Ontario" id="c1">Ontario</label>
        <label for="c2"><input type="radio" name="requirement" value="British_Columbia" id="c2">British Columbia</label>
        <label for="c3"><input type="radio" name="requirement" value="Quebec" id="c3">Quebec</label>
        <label for="c4"><input type="radio" name="requirement" value="New_York_State" id="c4">New York State</label>
        <div class="card_footer">
            <button>Back</button>
            <button>Next</button>
        </div>
        <div>
            <h4>Choose Your Catagories</h4>
            <label for="history"><input type="checkbox" name="category" value="history" id="history">History</label>
            <label for="geography"><input type="checkbox" name="category" value="geography"
                    id="geography">Geography</label>
            <label for="gaming"><input type="checkbox" name="category" value="gaming" id="gaming">Gaming</label>
            <label for="math"><input type="checkbox" name="category" value="math" id="math">Math</label>

            <h4>Choose Your Timer</h4>
            <label for="two_min"><input type="radio" name="timer" value="2" id="two_min">2:00</label>
            <label for="thr_min"><input type="radio" name="timer" value="3" id="thr_min">3:00</label>
            <label for="four_min"><input type="radio" name="timer" value="4" id="four_min">4:00</label>
            <label for="fiv_min"><input type="radio" name="timer" value="5" id="fiv_min">5:00</label>



            <div class="card_foot">
            <button>Submit</button>
            </div>
        <div>
            <h5>Highscores</h5>
            <ol>
                <li>LAYBloom</li>
                <li>Kreek</li>
                <li>Sam Hogan</li>
              </ol>  
        </div>

        <div>
            <h5>About</h5>
            <p>English: This is my amazing quiz game!</p>
        </div>
    </main>
    <footer></footer>
    <script src="assets/script.js"></script>

</body>

</html>
